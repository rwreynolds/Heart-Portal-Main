{% extends "base.html" %}

{% block title %}Page Not Found - Nutrition Database{% endblock %}

{% block additional_css %}
<style>
body {
    display: flex;
    align-items: center;
    justify-content: center;
}

.error-container {
    text-align: center;
    background: white;
    border-radius: 15px;
    padding: 60px 40px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    max-width: 500px;
}

.error-code {
    font-size: 6rem;
    font-weight: bold;
    color: #667eea;
    margin: 0;
}

.error-message {
    font-size: 1.5rem;
    margin: 20px 0;
    color: #374151;
}

.error-description {
    color: #6b7280;
    margin-bottom: 30px;
}

.btn {
    padding: 15px 30px;
    background: #667eea;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    transition: background 0.3s ease;
}

.btn:hover {
    background: #5568d3;
}
</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <h1 class="error-code">404</h1>
    <h2 class="error-message">Page Not Found</h2>
    <p class="error-description">
        The page you're looking for doesn't exist in the Nutrition Database.
    </p>
    <a href="/" class="btn">Return to Search</a>
</div>
{% endblock %}
