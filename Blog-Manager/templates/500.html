{% extends "base.html" %}

{% block title %}Server Error - Heart Failure Portal{% endblock %}

{% block additional_css %}
<style>
        .error-content {
            text-align: center;
            padding: 100px 0;
            color: white;
        }
        .error-content h1 {
            font-size: 6rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .error-content h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .error-content p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
</style>
{% endblock %}

{% block content %}
<div style="padding-top: 80px;">
    <section class="error-content">
        <div class="container">
            <h1>500</h1>
            <h2>Server Error</h2>
            <p>Sorry, something went wrong on our end.</p>
            <a href="{{ get_blog_url() }}" class="btn">Return to Blog</a>
        </div>
    </section>
</div>
{% endblock %}
