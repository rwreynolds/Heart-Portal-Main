{% extends "base.html" %}

{% block title %}Server Error - Heart Failure Portal{% endblock %}

{% block additional_css %}
<style>
    .error-content {
        text-align: center;
        padding: 100px 0;
        min-height: calc(100vh - 200px);
    }
    .error-content h1 {
        font-size: 6rem;
        margin-bottom: 20px;
        color: #dc2626;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }
    .error-content h2 {
        font-size: 2rem;
        margin-bottom: 20px;
        color: #2c3e50;
    }
    .error-content p {
        font-size: 1.2rem;
        margin-bottom: 40px;
        color: #6c757d;
    }
    .btn {
        display: inline-block;
        padding: 15px 30px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        border-radius: 50px;
        font-size: 1.1rem;
        transition: all 0.3s;
        font-weight: 600;
    }
    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        text-decoration: none;
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<section class="error-content">
    <div class="main-container">
        <h1>500</h1>
        <h2>Server Error</h2>
        <p>Sorry, something went wrong on our end. Please try again later.</p>
        <a href="{{ get_main_app_url() }}" class="btn">Return Home</a>
    </div>
</section>
{% endblock %}
