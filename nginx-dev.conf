# Development nginx configuration for Heart Portal
# Single domain reverse proxy for cross-application authentication

events {
    worker_connections 1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /tmp/nginx-access.log;
    error_log /tmp/nginx-error.log;

    # Enable the substitution module for URL rewriting
    sub_filter_once off;
    sub_filter_types text/css text/javascript application/javascript;

    # Proxy settings for Flask apps
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port $server_port;

    server {
        listen 8080;
        server_name localhost;

        # Main App (Heart Portal Landing)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_redirect http://127.0.0.1:3000/ http://localhost:8080/;
            proxy_redirect http://localhost:3000/ http://localhost:8080/;

            # Rewrite URLs in HTML content
            sub_filter 'http://localhost:3000' 'http://localhost:8080';
            sub_filter 'http://127.0.0.1:3000' 'http://localhost:8080';
            sub_filter 'localhost:3000' 'localhost:8080';
        }

        # Blog Manager
        location /blog/ {
            rewrite ^/blog/(.*) /$1 break;
            proxy_pass http://127.0.0.1:5002;
            proxy_redirect http://127.0.0.1:5002/ http://localhost:8080/blog/;
            proxy_redirect http://localhost:5002/ http://localhost:8080/blog/;
        }

        # Nutrition Database
        location /nutrition/ {
            rewrite ^/nutrition/(.*) /$1 break;
            proxy_pass http://127.0.0.1:5000;
            proxy_redirect off;
        }

        # Food Base
        location /food/ {
            rewrite ^/food/(.*) /$1 break;
            proxy_pass http://127.0.0.1:5001;
            proxy_redirect off;
        }

        # Sodium Tracker
        location /sodium/ {
            rewrite ^/sodium/(.*) /$1 break;
            proxy_pass http://127.0.0.1:5003;
            proxy_redirect off;
        }

        # Fluid Tracker
        location /fluid/ {
            rewrite ^/fluid/(.*) /$1 break;
            proxy_pass http://127.0.0.1:5004;
            proxy_redirect off;
        }

        # Weight Tracker
        location /weight/ {
            rewrite ^/weight/(.*) /$1 break;
            proxy_pass http://127.0.0.1:5005;
            proxy_redirect off;
        }
    }
}