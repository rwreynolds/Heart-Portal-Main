{% extends "base.html" %}

{% block title %}Edit Sodium Entry - Heart Portal{% endblock %}

{% block additional_css %}
<style>
.main-content {
    padding: 40px 0;
}

.page-header {
    text-align: center;
    margin-bottom: 40px;
}

.page-header h1 {
    color: white;
    font-size: 2.5rem;
    margin-bottom: 10px;
}

.page-header p {
    color: #e5e7eb;
    font-size: 1.1rem;
}

.form-card {
    background: white;
    border-radius: 15px;
    padding: 40px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    max-width: 700px;
    margin: 0 auto;
}

.form-group {
    margin-bottom: 25px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #374151;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 0.3s ease;
    box-sizing: border-box;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.form-group textarea {
    height: 80px;
    resize: vertical;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.btn {
    padding: 15px 30px;
    border: none;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    transition: all 0.3s ease;
    cursor: pointer;
    display: inline-block;
    text-align: center;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-secondary {
    background: #6b7280;
    color: white;
}

.btn-secondary:hover {
    background: #4b5563;
}

.form-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 30px;
}

.required {
    color: #ef4444;
}

.back-button-container {
    margin-bottom: 20px;
    position: relative;
    z-index: 10;
}

.btn-back {
    background-color: #6c757d !important;
    color: white !important;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.9rem;
    transition: background-color 0.3s;
    display: inline-flex !important;
    align-items: center;
    gap: 8px;
    position: relative;
    z-index: 10;
}

.btn-back:hover {
    background-color: #5a6268 !important;
    color: white !important;
    text-decoration: none;
}

.btn-back i {
    font-size: 0.8rem;
}

@media (max-width: 768px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-actions {
        flex-direction: column;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="main-container" style="padding-top: 80px;">
    <div class="back-button-container">
        <a href="{{ get_sodium_url() }}/history" class="btn-back">
            <i class="fas fa-arrow-left"></i> Back to History
        </a>
    </div>

    <!-- Page Header -->
    <div class="page-header">
        <h1>✏️ Edit Sodium Entry</h1>
        <p>Update your sodium intake record</p>
    </div>

    <!-- Entry Form -->
    <div class="form-card">
        <form method="POST" action="{{ get_sodium_url() }}/edit_entry/{{ entry.id }}">
            <div class="form-group">
                <label for="food_item">Food Item <span class="required">*</span></label>
                <input type="text" id="food_item" name="food_item" required
                       value="{{ entry.food_item }}"
                       placeholder="e.g., Canned soup, Frozen dinner, Potato chips">
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="sodium_mg">Sodium (mg) <span class="required">*</span></label>
                    <input type="number" id="sodium_mg" name="sodium_mg" required min="0"
                           value="{{ entry.sodium_mg }}"
                           placeholder="e.g., 380">
                </div>

                <div class="form-group">
                    <label for="serving_size">Serving Size</label>
                    <input type="text" id="serving_size" name="serving_size"
                           value="{{ entry.serving_size or '' }}"
                           placeholder="e.g., 1 cup, 1 slice">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="meal_type">Meal Type</label>
                    <select id="meal_type" name="meal_type">
                        <option value="">Select meal type</option>
                        <option value="Breakfast" {% if entry.meal_type == 'Breakfast' %}selected{% endif %}>Breakfast</option>
                        <option value="Lunch" {% if entry.meal_type == 'Lunch' %}selected{% endif %}>Lunch</option>
                        <option value="Dinner" {% if entry.meal_type == 'Dinner' %}selected{% endif %}>Dinner</option>
                        <option value="Snack" {% if entry.meal_type == 'Snack' %}selected{% endif %}>Snack</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" value="{{ entry.date }}">
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Notes (Optional)</label>
                <textarea id="notes" name="notes"
                          placeholder="Any additional notes about this food item">{{ entry.notes or '' }}</textarea>
            </div>

            <div class="form-actions">
                <a href="{{ get_sodium_url() }}/history" class="btn btn-secondary">✖ Cancel</a>
                <button type="submit" class="btn btn-primary">💾 Update Entry</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
